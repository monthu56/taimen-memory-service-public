[project]
name = "platform-memory-client"
version = "0.2.0"
description = "Thin, typed HTTP client for memory-service (/api/brain/*, /api/memory/*). httpx + pydantic only, no engine dependencies."
readme = "README.md"
requires-python = ">=3.12"
# Same licence as the engine (Apache-2.0): the client is the public consumer SDK of the
# service and stays licence- and dependency-isolated with it.
license = { text = "Apache-2.0" }
authors = [{ name = "Aleksandr Pereboev" }]
keywords = ["memory", "rag", "knowledge-graph", "client", "sdk"]
# Deliberately minimal: a consumer that only calls the service must NOT pull the
# engine's stack (psycopg / openai / networkx / fastapi).
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_memory_client"]
